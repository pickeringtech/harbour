name: Published package smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Exact released version to verify (for example v0.0.8)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-package-smoke-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Packagist archive / Laravel 13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Install the immutable public package and exercise its documented path
        env:
          HARBOUR_RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: bash tools/published-package-smoke.sh "${HARBOUR_RELEASE_VERSION}"
