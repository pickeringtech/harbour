name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer audit --locked --no-interaction
      - run: npm ci
      - run: npm audit --audit-level=high

  documentation:
    name: README / Mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run readme:check
      - run: npm run docs:build

  quality:
    name: PHP ${{ matrix.php }} / quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer format:check
      - run: composer analyse
      - run: composer test

  fuzz:
    name: Property / fuzz testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer fuzz

  databases-and-redis:
    name: PostgreSQL / MySQL / Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: harbour
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: harbour
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -pharbour"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARBOUR_DATABASE_INTEGRATION: '1'
      HARBOUR_REDIS_INTEGRATION: '1'
      POSTGRES_PASSWORD: harbour
      MYSQL_PASSWORD: harbour
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer test:integration

  docker:
    name: Docker / Compose ownership
    runs-on: ubuntu-latest
    env:
      HARBOUR_DOCKER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: docker compose version
      - run: vendor/bin/phpunit tests/Integration/DockerIntegrationTest.php

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: harbour
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: harbour
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -pharbour"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARBOUR_DATABASE_INTEGRATION: '1'
      HARBOUR_REDIS_INTEGRATION: '1'
      HARBOUR_DOCKER_INTEGRATION: '1'
      POSTGRES_PASSWORD: harbour
      MYSQL_PASSWORD: harbour
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: pcov
      - uses: ramsey/composer-install@v4
      - run: composer coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage.xml

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: pcov
      - uses: ramsey/composer-install@v4
      - run: composer mutate

  installability:
    name: Fresh Laravel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer create-project laravel/laravel:^13.0 /tmp/harbour-app --no-interaction
      - run: composer config repositories.harbour path ${{ github.workspace }}
        working-directory: /tmp/harbour-app
      - run: composer require --dev pickeringtech/harbour:@dev --no-interaction
        working-directory: /tmp/harbour-app
      - run: php artisan list --format=json | grep -q workspace:setup
        working-directory: /tmp/harbour-app
      - name: Auto-detect and install Harbour project configuration
        run: |
          php artisan workspace:install --detect --json | tee /tmp/harbour-install.json
          grep -q '"detected":true' /tmp/harbour-install.json
          grep -q '"database":"sqlite"' /tmp/harbour-install.json
        working-directory: /tmp/harbour-app
      - name: Exercise setup and teardown in the fresh application
        working-directory: /tmp/harbour-app
        run: |
          original_checksum="$(sha256sum .env | cut -d ' ' -f 1)"
          composer validate --strict
          composer workspace:setup
          php artisan workspace:status --json | grep -q '"status":"ready"'
          composer workspace:teardown -- --force
          test ! -e .harbour.json
          test "$(sha256sum .env | cut -d ' ' -f 1)" = "${original_checksum}"

  acceptance:
    name: Two-worktree acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: harbour
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARBOUR_ACCEPTANCE_DOCKER: '1'
      POSTGRES_PASSWORD: harbour
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer acceptance
