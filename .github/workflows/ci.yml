name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer audit --locked --no-interaction
      - run: npm ci
      - name: Audit npm dependencies
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0

            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi

            echo "::warning::npm audit attempt ${attempt} failed; retrying after a transient-error delay."
            sleep $((attempt * 10))
          done

  security-analysis:
    name: PHP security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer security:analyse

  documentation:
    name: README / Mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run readme:check
      - run: npm run docs:build

  quality:
    name: PHP ${{ matrix.php }} / quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer validate --strict
      - run: composer format:check
      - run: composer analyse
      - run: composer test

  fuzz:
    name: Property / fuzz testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer fuzz

  databases-and-redis:
    name: PostgreSQL / MySQL / Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: harbour
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: harbour
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -pharbour"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARBOUR_DATABASE_INTEGRATION: '1'
      HARBOUR_REDIS_INTEGRATION: '1'
      POSTGRES_PASSWORD: harbour
      MYSQL_PASSWORD: harbour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer test:integration

  docker:
    name: Docker / Compose ownership
    runs-on: ubuntu-latest
    env:
      HARBOUR_DOCKER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: docker compose version
      - run: vendor/bin/phpunit tests/Integration/DockerIntegrationTest.php tests/Integration/GeneratedComposeIntegrationTest.php

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: harbour
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: harbour
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -pharbour"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARBOUR_DATABASE_INTEGRATION: '1'
      HARBOUR_REDIS_INTEGRATION: '1'
      HARBOUR_DOCKER_INTEGRATION: '1'
      POSTGRES_PASSWORD: harbour
      MYSQL_PASSWORD: harbour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: build/coverage.xml

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer mutate

  installability:
    name: Fresh Laravel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer create-project laravel/laravel:^13.0 /tmp/harbour-app --no-interaction
      - run: composer config repositories.harbour path ${{ github.workspace }}
        working-directory: /tmp/harbour-app
      - run: composer require --dev pickeringtech/harbour:@dev --no-interaction
        working-directory: /tmp/harbour-app
      - run: php artisan list --format=json | grep -q workspace:setup
        working-directory: /tmp/harbour-app
      - name: Auto-detect and install Harbour project configuration
        run: |
          sha256sum .env | cut -d ' ' -f 1 > /tmp/harbour-original-env-checksum
          php artisan workspace:install --detect --start --json | tee /tmp/harbour-install.json
          grep -q '"detected":true' /tmp/harbour-install.json
          grep -q '"database":"sqlite"' /tmp/harbour-install.json
          grep -q '"started":true' /tmp/harbour-install.json
          php artisan workspace:status --json | grep -q '"status":"ready"'
        working-directory: /tmp/harbour-app
      - name: Exercise setup and teardown in the fresh application
        working-directory: /tmp/harbour-app
        run: |
          composer validate --strict
          composer workspace:setup
          php artisan workspace:status --json | grep -q '"status":"ready"'
          composer workspace:teardown -- --force
          test ! -e .harbour.json
          test "$(sha256sum .env | cut -d ' ' -f 1)" = "$(cat /tmp/harbour-original-env-checksum)"

  acceptance:
    name: Two-worktree acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: harbour
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HARBOUR_ACCEPTANCE_DOCKER: '1'
      POSTGRES_PASSWORD: harbour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer acceptance
