name: Release reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'releases.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-reconciliation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate desired release state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Validate release ledger and required checks
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MAIN_REF: ${{ github.sha }}
          RELEASE_SKIP_REQUIRED_CHECKS: '1'
        run: php tools/release.php validate

  publish:
    name: Reconcile immutable releases
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Mint least-privilege release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-checks: read
          permission-contents: write
      - name: Reconcile tags, releases, and Packagist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_MAIN_REF: ${{ github.sha }}
          RELEASE_SIGNER_EMAIL: 31162594+rpickz@users.noreply.github.com
          RELEASE_SIGNER_NAME: rpickz
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: php tools/release.php reconcile
