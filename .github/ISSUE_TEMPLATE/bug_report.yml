name: Bug report
description: Report reproducible Harbour behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security or ownership-bypass reports must use the private advisory flow.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include commands, configuration with secrets removed, expected behavior, and actual behavior.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Harbour commit/version, PHP, Laravel, OS, Docker/Compose if relevant
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste workspace:status --json and relevant error code. Check again for secrets.
